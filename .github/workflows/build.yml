# GitHub Actions 编译 RE-CP-03 ImmortalWrt 24.10 固件（草稿 v2）
#
# v2 改动：runs-on 从 ubuntu-22.04 换成 ubuntu-24.04——
# 22.04 的 GitHub runner 镜像 2026-09-17 已开始 deprecation
# （2027-04-17 彻底下线），24.04 编译 OpenWrt 24.10 完全没问题。
#
# 用法：
#   1. 在你自己的 GitHub 账号下新建一个空仓库（比如 re-cp-03-firmware）
#   2. 把本文件放进仓库的 .github/workflows/build.yml
#   3. 仓库页面点 Actions → 选这个 workflow → Run workflow
#   4. 编完在页面底部的 Artifacts 里下载
#      immortalwrt-mediatek-filogic-jdcloud_re-cp-03-squashfs-sysupgrade.bin
#
# 配置：LAN 192.168.6.1（workflow 里显式 patch）、无 docker、
# ddns、upnp、filemanager、turboACC（defconfig 自带）。
# passwall、mosdns、udpxy+igmpproxy 不编进固件，用户刷完自己装。
#
# 关键修复：编译前去掉源码树里所有"全局可写"权限位。
# 之前本地编的固件刷机后 LuCI 报 "luci/getFeatures failed -32000"，
# 根因就是构建环境的 umask 问题导致 /usr/share/rpcd/ucode/ 下的脚本
# 是 666 权限，rpcd 出于安全考虑直接拒绝加载。GHA 默认 umask 022
# 本来不会踩坑，这里再加一道保险。

name: Build RE-CP-03 ImmortalWrt

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: defconfig/mt7986-ax6000.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++-multilib gawk \
            gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
            ccache cmake cpio device-tree-compiler libelf-dev libglib2.0-dev \
            libpython3-dev libtool ninja-build patch pkgconf python3-pyelftools \
            squashfs-tools swig texinfo uglifyjs upx-ucl xxd zstd

      - name: Clone source
        run: |
          git clone -b "$REPO_BRANCH" --single-branch --filter=blob:none \
            "$REPO_URL" openwrt

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        working-directory: openwrt
        run: |
          cp -f "$CONFIG_FILE" .config
          # 默认 LAN IP 改成 192.168.6.1（改 config_generate 的默认 fallback）
          sed -i 's/ipad=${ipaddr:-"192.168.1.1"}/ipad=${ipaddr:-"192.168.6.1"}/' \
            package/base-files/files/bin/config_generate
          grep -q '192.168.6.1' package/base-files/files/bin/config_generate \
            && echo "LAN IP patched to 192.168.6.1"
          # 精简版：只加 ddns / upnp / filemanager；
          # passwall、mosdns、udpxy+igmpproxy（组播）不编进固件，用户刷完自己装
          cat >> .config <<'CFGEOF'
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-filemanager=y
          CFGEOF
          make defconfig

      - name: Fix world-writable file modes (rpcd root-cause fix)
        working-directory: openwrt
        run: |
          # rpcd 会拒绝加载全局可写的 ucode 脚本（/usr/share/rpcd/ucode/*），
          # 导致 LuCI 报 "luci/getFeatures failed with error -32000"。
          # 构建机 umask 异常时源码文件会变成 666/777，这里统一去掉 o+w。
          umask 022
          find . -path ./.git -prune -o -perm -o+w -exec chmod o-w {} + 2>/dev/null || true
          echo "remaining world-writable files:"
          find . -path ./.git -prune -o -perm -o+w -print 2>/dev/null | head -5 || true

      - name: Compile
        working-directory: openwrt
        run: |
          echo "$(nproc) cores"
          make -j"$(nproc)" V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-cp-03-sysupgrade
          path: openwrt/bin/targets/mediatek/filogic/*re-cp-03*squashfs-sysupgrade.bin
          if-no-files-found: error
